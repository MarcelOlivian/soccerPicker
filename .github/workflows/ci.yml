name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npx oxlint src

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke e2e
        run: npx playwright test e2e/smoke.spec.ts

      # Exercised against a locally-run PeerServer, not the public PeerJS
      # broker — see e2e/live.spec.ts for why. Kept out of the deploy gate
      # (deploy.yml) since it drives real WebRTC connections end to end and
      # can be flakier than the rest of the suite; failures here are worth a
      # look but shouldn't block shipping the rest of the app.
      - name: Live sync e2e (local PeerServer)
        run: npx playwright test e2e/live.spec.ts
        continue-on-error: true
